[package]
name = "cargo-craftcheck"
version = "2.0.0-rc9"
edition = "2024"
description = "Portable Craftbook v2 policy validator for Cargo workspaces"
license = "MIT OR Apache-2.0"
repository = "https://github.com/F000NKKK/Craftbook"
homepage = "https://github.com/F000NKKK/Craftbook"
documentation = "https://docs.rs/cargo-craftcheck"
publish = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
toml_edit = "0.25.17"
serde_json = "1.0.154"
cel = { version = "0.11.3", features = ["json"] }
