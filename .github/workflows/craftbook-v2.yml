name: craftbook-v2

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check --manifest-path tools/cargo-craftcheck/Cargo.toml
      - name: Clippy
        run: cargo clippy --all-targets --manifest-path tools/cargo-craftcheck/Cargo.toml -- -D warnings
      - name: Tests
        run: cargo test --manifest-path tools/cargo-craftcheck/Cargo.toml
      - name: Craftbook self-check (policy)
        run: cargo run --quiet --manifest-path tools/cargo-craftcheck/Cargo.toml -- check
      - name: Craftbook self-check (workspace edges)
        run: cargo run --quiet --manifest-path tools/cargo-craftcheck/Cargo.toml -- deps
      - name: Nested self-check (policy)
        working-directory: tools/cargo-craftcheck
        run: cargo run --quiet -- check
      - name: Nested self-check (dependencies)
        working-directory: tools/cargo-craftcheck
        run: cargo run --quiet -- deps
      - name: Craftbook self-check (effective configuration)
        run: cargo run --quiet --manifest-path tools/cargo-craftcheck/Cargo.toml -- config
      - name: Nested self-check (explain inheritance)
        working-directory: tools/cargo-craftcheck
        run: cargo run --quiet -- explain
      - name: Self-check JSON output
        run: |
          cargo run --quiet --manifest-path tools/cargo-craftcheck/Cargo.toml -- check --format json > craftcheck.json
          jq -e '.success == true and (.diagnostics | length == 0)' craftcheck.json
      - name: Self-check invalid policy diagnostic contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path tools/cargo-craftcheck/Cargo.toml
          checker="$PWD/tools/cargo-craftcheck/target/debug/cargo-craftcheck"
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          cat > "$fixture/CraftBook.toml" <<'EOF'
          version = "wrong"
          project = "app"
          [assurance]
          clippy = "yes"
          EOF
          if (cd "$fixture" && "$checker" check --format json) > "$fixture/report.json" 2> "$fixture/errors.txt"; then
            echo "Invalid policy unexpectedly passed"
            exit 1
          fi
          jq -e '
            .schemaVersion == 1 and .tool == "cargo-craftcheck" and .success == false
            and ([.diagnostics[] | select(.message == "version must be integer" and .line == 1 and .column == 11 and .end_column == 18)] | length == 1)
            and ([.diagnostics[] | select(.message == "assurance.clippy must be boolean" and .line == 4)] | length == 1)
          ' "$fixture/report.json"
          if (cd "$fixture" && "$checker" check --format sarif) > "$fixture/report.sarif" 2> /dev/null; then
            echo "Invalid policy SARIF unexpectedly passed"
            exit 1
          fi
          jq -e '
            .version == "2.1.0"
            and ([.runs[0].results[] | select(.message.text == "version must be integer"
              and .locations[0].physicalLocation.region.startLine == 1
              and .locations[0].physicalLocation.region.startColumn == 11)] | length == 1)
          ' "$fixture/report.sarif"
          if (cd "$fixture" && "$checker" check --format text) > /dev/null 2> "$fixture/report.txt"; then
            echo "Invalid policy text unexpectedly passed"
            exit 1
          fi
          grep -Fq "CraftBook.toml:1:11: [CB001] version must be integer" "$fixture/report.txt"
      - name: Self-check SARIF output
        run: |
          cargo run --quiet --manifest-path tools/cargo-craftcheck/Cargo.toml -- deps --format sarif > craftcheck.sarif
          jq -e '.version == "2.1.0" and (.runs | length == 1)' craftcheck.sarif

  portability:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cross-platform tests
        run: cargo test --manifest-path tools/cargo-craftcheck/Cargo.toml
