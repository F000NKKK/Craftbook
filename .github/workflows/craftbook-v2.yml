name: craftbook-v2

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check --manifest-path tools/cargo-craftcheck/Cargo.toml
      - run: cargo clippy --all-targets --manifest-path tools/cargo-craftcheck/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path tools/cargo-craftcheck/Cargo.toml
      - run: cargo run --quiet --manifest-path tools/cargo-craftcheck/Cargo.toml -- check --config templates/CraftBook.toml
