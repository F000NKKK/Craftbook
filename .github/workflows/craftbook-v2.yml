name: craftbook-v2

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Release note generator tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Format
        run: cargo fmt --all --check --manifest-path tools/cargo-craftcheck/Cargo.toml
      - name: Clippy
        run: cargo clippy --all-targets --manifest-path tools/cargo-craftcheck/Cargo.toml -- -D warnings
      - name: Tests
        run: cargo test --manifest-path tools/cargo-craftcheck/Cargo.toml
      - name: Craftbook self-check (policy)
        run: cargo run --quiet --manifest-path tools/cargo-craftcheck/Cargo.toml -- check
      - name: Craftbook self-check (workspace edges)
        run: cargo run --quiet --manifest-path tools/cargo-craftcheck/Cargo.toml -- deps
      - name: Nested self-check (policy)
        working-directory: tools/cargo-craftcheck
        run: cargo run --quiet -- check
      - name: Nested self-check (dependencies)
        working-directory: tools/cargo-craftcheck
        run: cargo run --quiet -- deps
      - name: Craftbook self-check (effective configuration)
        run: cargo run --quiet --manifest-path tools/cargo-craftcheck/Cargo.toml -- config
      - name: Verify effective configuration is valid TOML
        shell: bash
        run: |
          cargo run --quiet --manifest-path tools/cargo-craftcheck/Cargo.toml -- config > effective-config.toml
          python3 -c 'import tomllib; data=tomllib.load(open("effective-config.toml", "rb")); assert data["version"] == 2 and data["project"] == "Craftbook"'
      - name: Nested self-check (explain inheritance)
        working-directory: tools/cargo-craftcheck
        run: cargo run --quiet -- explain
      - name: Validate shipped policy template
        run: |
          python3 -c 'import tomllib; p=tomllib.load(open("templates/CraftBook.toml", "rb")); assert p["version"] == 2 and p["project"] == "example" and p["profiles"] == ["simple"]'
      - name: Validate optional CI template instructions
        run: |
          grep -Fq 'cargo craftcheck check --format json' templates/ci.yml
          grep -Fq 'cargo craftcheck deps --format sarif' templates/ci.yml
          grep -Fq 'actions/upload-artifact@v4' templates/ci.yml
      - name: Self-check JSON output
        run: |
          cargo run --quiet --manifest-path tools/cargo-craftcheck/Cargo.toml -- check --format json > craftcheck.json
          jq -e '.schemaVersion == 1 and .tool == "cargo-craftcheck" and .success == true and (.diagnostics | length == 0)' craftcheck.json
      - name: Self-check SARIF output
        run: |
          cargo run --quiet --manifest-path tools/cargo-craftcheck/Cargo.toml -- deps --format sarif > craftcheck.sarif
          jq -e '.version == "2.1.0" and (.runs | length == 1) and .runs[0].tool.driver.name == "cargo-craftcheck" and (.runs[0].results | length == 0)' craftcheck.sarif
      - name: Capture self-check analysis reports
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          set +e
          mkdir -p target/self-check-reports/project
          cp craftcheck.json target/self-check-reports/project/check.json 2>/dev/null || true
          cp craftcheck.sarif target/self-check-reports/project/deps.sarif 2>/dev/null || true
          if [ -x tools/cargo-craftcheck/target/debug/cargo-craftcheck ]; then
            checker="$PWD/tools/cargo-craftcheck/target/debug/cargo-craftcheck"
            "$checker" check --format text > target/self-check-reports/project/check.txt 2>&1
            printf 'check text exit: %s\n' "$?" > target/self-check-reports/exit-codes.txt
            "$checker" deps --format json > target/self-check-reports/project/deps.json 2> target/self-check-reports/project/deps-errors.txt
            printf 'deps json exit: %s\n' "$?" >> target/self-check-reports/exit-codes.txt
            "$checker" config > target/self-check-reports/project/effective-config.toml 2> target/self-check-reports/project/config-errors.txt
            printf 'config exit: %s\n' "$?" >> target/self-check-reports/exit-codes.txt
            (cd tools/cargo-craftcheck && "$checker" explain) > target/self-check-reports/project/nested-explain.txt 2>&1
            printf 'nested explain exit: %s\n' "$?" >> target/self-check-reports/exit-codes.txt
          else
            echo "Checker binary not available; inspect previous build steps." > target/self-check-reports/exit-codes.txt
          fi
          printf '# Craftbook self-check report\n\nWorkflow: %s\nCommit: %s\nRun: %s\n\nOutputs are collected from actual analyzer executions. See exit-codes.txt and individual reports.\n' \
            "$GITHUB_WORKFLOW" "$GITHUB_SHA" "$GITHUB_RUN_ID" > target/self-check-reports/README.md
      - name: Upload self-check analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craftbook-self-check-${{ github.run_id }}
          path: target/self-check-reports/
          if-no-files-found: warn
          retention-days: 30

  portability:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cross-platform tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path tools/cargo-craftcheck/Cargo.toml 2>&1 | tee portability-tests.log
      - name: Upload cross-platform test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craftbook-tests-${{ matrix.os }}-${{ github.run_id }}
          path: portability-tests.log
          if-no-files-found: warn
          retention-days: 30
