name: Release Craftbook

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "::error::Invalid version tag $RELEASE_TAG"
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          manifest_version="$(python3 -c 'import tomllib; print(tomllib.load(open("tools/cargo-craftcheck/Cargo.toml", "rb"))["package"]["version"])')"
          lock_version="$(python3 -c 'import tomllib; p=tomllib.load(open("tools/cargo-craftcheck/Cargo.lock", "rb")); print(next(x["version"] for x in p["package"] if x["name"] == "cargo-craftcheck"))')"
          if [[ "$version" != "$manifest_version" || "$version" != "$lock_version" ]]; then
            echo "::error::Tag ($version), manifest ($manifest_version) and lockfile ($lock_version) differ"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-rc* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify package
        run: |
          cargo test --manifest-path tools/cargo-craftcheck/Cargo.toml --locked
          cargo package --manifest-path tools/cargo-craftcheck/Cargo.toml --locked
      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: python3 .github/scripts/release_notes.py --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/release-notes.md"
      - name: Publish crate if not already published
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if curl --fail --silent --show-error "https://crates.io/api/v1/crates/cargo-craftcheck/$VERSION" > /dev/null; then
            echo "cargo-craftcheck $VERSION is already on crates.io"
          else
            if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
              echo "::error::Configure CARGO_REGISTRY_TOKEN in the release environment"
              exit 1
            fi
            cargo publish --manifest-path tools/cargo-craftcheck/Cargo.toml --locked
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; leaving it unchanged"
          else
            options=(--title "Craftbook $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag)
            if [[ "$PRERELEASE" == true ]]; then options+=(--prerelease); else options+=(--latest); fi
            gh release create "$RELEASE_TAG" "${options[@]}"
          fi
