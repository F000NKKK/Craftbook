name: Release Craftbook

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (current continues prerelease number)
        required: true
        type: choice
        default: current
        options: [current, patch, minor, major]
      channel:
        description: Release channel
        required: true
        type: choice
        default: rc
        options: [alpha, beta, rc, stable]

permissions:
  contents: write

concurrency:
  group: craftbook-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare release versions and close Unreleased
        id: prepare
        env:
          BUMP: ${{ inputs.bump }}
          CHANNEL: ${{ inputs.channel }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 .github/scripts/prepare_release.py --bump "$BUMP" --channel "$CHANNEL" --output "$GITHUB_OUTPUT"
          cargo test --manifest-path tools/cargo-craftcheck/Cargo.toml --locked
          cargo package --manifest-path tools/cargo-craftcheck/Cargo.toml --locked --allow-dirty
      - name: Commit and tag prepared release
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md README.ru.md action.yml tools/cargo-craftcheck/Cargo.toml tools/cargo-craftcheck/Cargo.lock tools/cargo-craftcheck/README.md
          git commit -m "release: prepare $RELEASE_TAG"
          # Never force-push. Rebase on concurrent main updates, then tag the accepted commit.
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "::warning::main moved; retrying ($attempt/3)"
          done
          if [[ "$pushed" != true ]]; then
            echo "::error::Could not update main; no release tag created"
            exit 1
          fi
          git tag -a "$RELEASE_TAG" -m "Craftbook $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

  publish:
    needs: prepare
    if: always() && (github.event_name == 'push' || needs.prepare.result == 'success')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag || github.ref_name }}
      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)[0-9]+)?$ ]]; then
            echo "::error::Invalid version tag $RELEASE_TAG"
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          manifest_version="$(python3 -c 'import tomllib; print(tomllib.load(open("tools/cargo-craftcheck/Cargo.toml", "rb"))["package"]["version"])')"
          lock_version="$(python3 -c 'import tomllib; p=tomllib.load(open("tools/cargo-craftcheck/Cargo.lock", "rb")); print(next(x["version"] for x in p["package"] if x["name"] == "cargo-craftcheck"))')"
          if [[ "$version" != "$manifest_version" || "$version" != "$lock_version" ]]; then
            echo "::error::Tag ($version), manifest ($manifest_version) and lockfile ($lock_version) differ"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-alpha* || "$version" == *-beta* || "$version" == *-rc* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify package
        run: |
          cargo test --manifest-path tools/cargo-craftcheck/Cargo.toml --locked
          cargo package --manifest-path tools/cargo-craftcheck/Cargo.toml --locked
      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
        run: python3 .github/scripts/release_notes.py --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/release-notes.md"
      - name: Publish crate if not already published
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # Treat only HTTP 404 as "not published"; 403 and other failures are not absence.
          status="$(curl --silent --show-error --location --retry 3 \
            --user-agent "craftbook-release/1.0 (https://github.com/F000NKKK/Craftbook)" \
            --output "$RUNNER_TEMP/crates-version.json" --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/cargo-craftcheck/$VERSION")" || {
              echo "::error::Could not query crates.io; refusing to guess publication state"
              exit 1
            }
          case "$status" in
            200)
              echo "cargo-craftcheck $VERSION is already published on crates.io"
              ;;
            404)
              if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
                echo "::error::Missing CARGO_REGISTRY_TOKEN. Add it under Settings > Environments > release > Environment secrets, or configure a repository Actions secret."
                exit 1
              fi
              cargo publish --manifest-path tools/cargo-craftcheck/Cargo.toml --locked
              ;;
            *)
              echo "::error::crates.io returned HTTP $status. Not publishing until the registry check succeeds."
              exit 1
              ;;
          esac
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; leaving it unchanged"
          else
            options=(--title "Craftbook $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag)
            if [[ "$PRERELEASE" == true ]]; then options+=(--prerelease); else options+=(--latest); fi
            gh release create "$RELEASE_TAG" "${options[@]}"
          fi
