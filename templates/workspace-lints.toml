# Craftbook workspace lint set. Paste into the workspace root Cargo.toml;
# every member crate then adds
#
#   [lints]
#   workspace = true
#
# A crate whose job is unsafe code (a driver, an FFI binding, a SIMD/GPU
# kernel) states it once, at the top of its lib.rs:
#
#   #![expect(unsafe_code, reason = "wraps the wgpu device API")]
#
# Every other lint here is silenced only item by item, with
# #[expect(<lint>, reason = "<external constraint>")]; #[allow] is denied.

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
unsafe_code = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"
elided_lifetimes_in_paths = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
too_many_lines = "deny"
too_many_arguments = "deny"
excessive_nesting = "deny"
cognitive_complexity = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
module_name_repetitions = "warn"
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
redundant_pub_crate = "warn"
wildcard_imports = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "warn"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
mod_module_files = "allow"
self_named_module_files = "deny"
large_types_passed_by_value = "warn"
shadow_unrelated = "warn"
