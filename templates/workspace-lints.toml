# Craftbook v2 baseline. Adopt stricter lints based on project risk.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
# Additional candidates: pedantic, missing_errors_doc, unwrap_used,
# undocumented_unsafe_blocks. Select per project and document exceptions.
