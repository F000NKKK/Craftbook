# Craftbook v2: minimal portable Rust workspace CI.
# Adapt toolchain, features, supported targets and security gates to the project.
name: rust-quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
  # Optional project jobs: target matrix, fuzzing, Miri, integration,
  # performance checks, supply chain audits, deployment verification.
