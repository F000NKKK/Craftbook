# Craftbook quality gates for a Rust workspace (chapter 8 §8.5).
# Copy to .github/workflows/quality.yml and adjust the toolchain if pinned.
name: quality

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: F000NKKK/craftbook
          path: .craftbook
          # Needed while Craftbook is private: a fine-grained token that can read it.
          token: ${{ secrets.CRAFTBOOK_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: python3 .craftbook/tools/craftcheck check . --baseline .craftcheck-baseline
      - run: python3 .craftbook/tools/craftcheck deps . --baseline .craftcheck-deps-baseline
      - run: cargo doc --workspace --no-deps --all-features

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-deny
      - run: cargo deny check
      # Per-layer thresholds: run once per layer with that layer's packages
      # (list them from craftbook.toml), e.g.:
      #   cargo llvm-cov --package <domain crates…> --fail-under-lines 90
      - run: cargo llvm-cov --workspace --all-features --fail-under-lines 85 --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: lcov.info

  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - run: cargo mutants --workspace --in-place --no-shuffle
